<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad</title>
<style>
  :root {
    --bg: #f4f1ea; --paper: #fffdf7; --ink: #2b2b2b; --muted: #8a8577;
    --line: #e6e0d2; --accent: #3a6ea5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1b1b1d; --paper: #242427; --ink: #e8e6e1; --muted: #8d8a83; --line: #34343a; --accent: #7aa7d9; }
  }
  :root[data-theme="dark"] { --bg: #1b1b1d; --paper: #242427; --ink: #e8e6e1; --muted: #8d8a83; --line: #34343a; --accent: #7aa7d9; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px;
  }
  .pad {
    width: 100%; max-width: 860px; flex: 1;
    display: flex; flex-direction: column;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.06);
    overflow: hidden;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0 auto 0 0; font-weight: 600; }
  button {
    font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  textarea {
    flex: 1; width: 100%; min-height: 60vh; resize: none; border: 0; outline: 0;
    padding: 18px; background: transparent; color: var(--ink);
    font: 16px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  footer {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
    padding: 8px 14px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
  }
  #saved.ok { color: #3f8f4f; }
  #saved.warn { color: #b5651d; }
</style>
</head>
<body>
<div class="pad">
  <header>
    <h1>📝 Notepad</h1>
    <button id="exportBtn" title="Descargar una copia de seguridad (.txt)">Descargar copia</button>
    <button id="importBtn" title="Cargar un archivo .txt">Cargar archivo</button>
    <input type="file" id="fileInput" accept=".txt,text/plain" hidden>
  </header>
  <textarea id="note" placeholder="Escribe aquí… se guarda automáticamente." spellcheck="true" autofocus></textarea>
  <footer>
    <span id="saved">Cargando…</span>
    <span id="count">0 caracteres</span>
  </footer>
</div>

<script>
/*
  Guardado permanente:
  - Siempre: se guarda en localStorage Y en IndexedDB (doble copia en este navegador),
    y se pide almacenamiento "persistente" para que el navegador no lo borre solo.
  - Abierto en la web (claude.ai): además se guarda en la nube, en tu espacio privado,
    así lo ves desde cualquier dispositivo y no se pierde si borras el navegador.
  - "Descargar copia" guarda un .txt como respaldo extra.
*/
const KEY = 'notepad-content-v1';
const DB_NAME = 'notepad-db', STORE = 'notes';
const MAX_CLOUD = 250000; // límite aprox. de un documento en la nube (256 KiB)
const note = document.getElementById('note');
const savedEl = document.getElementById('saved');
const countEl = document.getElementById('count');

// ---- IndexedDB ----
function openDB() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject('no idb');
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet() {
  try {
    const db = await openDB();
    return await new Promise((res) => {
      const r = db.transaction(STORE).objectStore(STORE).get(KEY);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    });
  } catch { return null; }
}
async function idbSet(value) {
  try { (await openDB()).transaction(STORE, 'readwrite').objectStore(STORE).put(value, KEY); } catch {}
}
function lsGet() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function lsSet(value) { try { localStorage.setItem(KEY, JSON.stringify(value)); } catch {} }

// ---- Nube (solo cuando se abre en claude.ai) ----
let cloudRef = null, cloudBusy = false, cloudPending = null, cloudOk = false;
async function cloudWrite(value) {
  if (!cloudRef) return;
  if (value.text.length > MAX_CLOUD) { setStatus('⚠ Nota muy larga para la nube; guardada solo en este navegador', 'warn'); return; }
  if (cloudBusy) { cloudPending = value; return; }   // una escritura a la vez
  cloudBusy = true;
  try {
    await cloudRef.set(value);
    cloudOk = true;
    if (note.value === value.text) setStatus('✓ Guardado en la nube ' + new Date(value.updated).toLocaleString(), 'ok');
  } catch (e) {
    cloudOk = false;
    setStatus('⚠ Guardado solo en este navegador (sin conexión a la nube)', 'warn');
  } finally {
    cloudBusy = false;
    if (cloudPending) { const v = cloudPending; cloudPending = null; cloudWrite(v); }
  }
}

// ---- UI ----
function setStatus(text, cls) { savedEl.className = cls || ''; savedEl.textContent = text; }
function updateCount() {
  const t = note.value;
  const words = t.trim() ? t.trim().split(/\s+/).length : 0;
  countEl.textContent = `${words} palabras · ${t.length} caracteres`;
}
function showSaved(ts) {
  setStatus('✓ Guardado' + (cloudRef ? ' en la nube ' : ' ') + new Date(ts).toLocaleString(), 'ok');
}

let lastSaved = null;
function save() {
  if (note.value === lastSaved) return;
  lastSaved = note.value;
  const value = { text: note.value, updated: Date.now() };
  lsSet(value); idbSet(value);
  if (cloudRef) cloudWrite(value); else showSaved(value.updated);
}

let timer;
note.addEventListener('input', () => {
  setStatus('Guardando…');
  updateCount();
  clearTimeout(timer);
  timer = setTimeout(save, 800);
});
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

function apply(best) {
  note.value = best.text;
  lastSaved = best.text;
  updateCount();
  showSaved(best.updated);
}

(async function init() {
  if (navigator.storage && navigator.storage.persist) { try { await navigator.storage.persist(); } catch {} }
  const local = [lsGet(), await idbGet()].filter(Boolean).sort((x, y) => y.updated - x.updated)[0] || null;
  if (local) { apply(local); lsSet(local); idbSet(local); }
  else { setStatus('Nuevo bloc de notas'); updateCount(); }

  // Conectar a la nube si estamos en claude.ai
  if (!(window.claude && window.claude.use)) return;
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = db && user ? await user.id() : null;
    if (!uid) return;
    const ref = db.doc('data/users/' + uid + '/note');
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    cloudRef = ref;
    const typedMeanwhile = note.value !== (local ? local.text : '');
    if (remote && typeof remote.text === 'string' && (!local || remote.updated > local.updated) && !typedMeanwhile) {
      apply(remote); lsSet(remote); idbSet(remote);
    } else if (note.value) {
      lastSaved = null; save(); // subir la versión local más nueva
    } else {
      setStatus('Nuevo bloc de notas · se guardará en la nube');
    }
  } catch { /* sin nube: sigue funcionando en el navegador */ }
})();

// ---- Descargar / cargar ----
document.getElementById('exportBtn').onclick = async () => {
  const filename = 'notas-' + new Date().toISOString().slice(0, 10) + '.txt';
  if (window.claude && window.claude.use) {
    const dl = await claude.use('downloads').catch(() => null);
    if (dl) { try { await dl.save({ filename, data: note.value }); } catch {} return; }
  }
  const blob = new Blob([note.value], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
const fileInput = document.getElementById('fileInput');
document.getElementById('importBtn').onclick = () => fileInput.click();
fileInput.onchange = async () => {
  const f = fileInput.files[0];
  if (!f) return;
  if (note.value && !confirm('Esto reemplazará tu nota actual. ¿Continuar?')) { fileInput.value = ''; return; }
  note.value = await f.text();
  updateCount();
  save();
  fileInput.value = '';
};
</script>
</body>
</html>
